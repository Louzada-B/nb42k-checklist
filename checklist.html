<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e4e1db;
    --border2: #d0ccc4;
    --text: #1a1a1a;
    --text2: #666;
    --text3: #aaa;
    --accent: #d05a1e;
    --accent-light: #fff0e8;
    --accent-border: #f0c4a8;
    --green: #2a7a50;
    --green-light: #eaf5f0;
    --green-border: #b0d8c4;
    --blue: #1a5a9a;
    --blue-light: #eaf2fb;
    --yellow: #a07010;
    --yellow-light: #fef6e0;
    --purple: #6a4a9a;
    --purple-light: #f3eefb;
    --red: #c03030;
    --red-light: #fdf0f0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* HEADER */
  .top-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .top-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 3px;
  }
  .top-title {
    font-family: 'Inter Tight', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }
  .top-title span { color: var(--accent); }
  .top-right { text-align: right; flex-shrink: 0; }
  .countdown-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 2px; }
  .countdown-num {
    font-family: 'Inter Tight', sans-serif;
    font-size: 28px; font-weight: 800;
    color: var(--accent); line-height: 1;
  }
  .countdown-sub { font-size: 10px; color: var(--text3); margin-top: 1px; }

  /* PROGRESS */
  .progress-bar-wrap {
    max-width: 680px;
    margin: 12px auto 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-bar-bg {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 10px;
    transition: width 0.4s ease;
  }
  .progress-pct {
    font-family: 'Inter Tight', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    min-width: 36px;
    text-align: right;
  }

  /* MAIN */
  .main { max-width: 680px; margin: 0 auto; padding: 28px 16px 0; }

  /* DAY SECTION */
  .day-section { margin-bottom: 28px; }
  .day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .day-chip {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .day-title {
    font-family: 'Inter Tight', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .day-progress {
    margin-left: auto;
    font-size: 11px;
    color: var(--text3);
    font-family: 'Inter Tight', sans-serif;
    font-weight: 600;
    flex-shrink: 0;
  }
  .day-progress.done { color: var(--green); }

  /* CATEGORY */
  .cat-block { margin-bottom: 10px; }
  .cat-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 4px;
    margin-bottom: 5px;
  }

  /* ITEMS */
  .items { display: flex; flex-direction: column; gap: 2px; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.2s;
    user-select: none;
  }
  .item:hover { border-color: var(--border2); }
  .item.checked {
    background: #fafaf8;
    border-color: var(--border);
    opacity: 0.6;
  }
  .item.checked .item-text { text-decoration: line-through; color: var(--text3); }
  .item.checked .item-note { text-decoration: line-through; }

  .checkbox {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--border2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    background: var(--surface);
  }
  .item.checked .checkbox {
    background: var(--green);
    border-color: var(--green);
  }
  .checkbox-tick {
    opacity: 0;
    transition: opacity 0.15s;
  }
  .item.checked .checkbox-tick { opacity: 1; }

  .item-body { flex: 1; min-width: 0; }
  .item-text { font-size: 13.5px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .item-note { font-size: 11.5px; color: var(--text2); margin-top: 2px; line-height: 1.4; }

  .item-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* COLOR SCHEMES PER DAY */
  .chip-mon { background: #f0ede8; color: #666; }
  .chip-tue { background: #fef6e0; color: var(--yellow); }
  .chip-wed { background: #fde8e0; color: var(--red); }
  .chip-thu { background: #fde8e0; color: var(--red); }
  .chip-fri { background: #eaf2fb; color: var(--blue); }
  .chip-sat { background: #f3eefb; color: var(--purple); }
  .chip-sun { background: var(--accent-light); color: var(--accent); }

  /* DOT COLORS */
  .dot-food { background: #f0a860; }
  .dot-body { background: #60b0f0; }
  .dot-gear { background: #80c880; }
  .dot-sleep { background: #a080e0; }
  .dot-race { background: var(--accent); }
  .dot-hydro { background: #40b8c8; }
  .dot-mental { background: #d080a0; }

  /* RACE DAY SPECIAL */
  .race-day-banner {
    background: var(--accent-light);
    border: 1px solid var(--accent-border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .race-day-banner-icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .race-day-banner-text { font-size: 13px; color: var(--accent); font-weight: 500; line-height: 1.5; }
  .race-day-banner-time {
    font-family: 'Inter Tight', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    margin-left: auto;
    flex-shrink: 0;
  }

  /* RESET BTN */
  .reset-btn {
    display: block;
    margin: 32px auto 0;
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 12px;
    color: var(--text3);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* ALL DONE TOAST */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: white;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .nav-strip {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

  .nav-strip-inner {
    max-width: 680px;

    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;

  .nav-link {

    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid #ddd;

    background: #fff;

  .nav-link-guia {

    background: var(--accent-light);
    transition: background 0.15s;
  }

</style>
</head>

// State
let state = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) { state = {}; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getAllItems() {
  const items = [];
  DAYS.forEach(day => day.cats.forEach(cat => cat.items.forEach(item => items.push(item))));
  return items;
}

function countDayItems(day) {
  let total = 0, done = 0;
  day.cats.forEach(cat => cat.items.forEach(item => {
    total++;
    if (state[item.id]) done++;
  }));
  return { total, done };
}

function updateProgress() {
  const all = getAllItems();
  const done = all.filter(i => state[i.id]).length;
  const pct = all.length ? Math.round((done / all.length) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  if (pct === 100) showToast();
}

function updateCountdown() {
  const race = new Date('2026-07-12T07:00:00-03:00');
  const now = new Date();
  const diff = race - now;
  const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
  const el = document.getElementById('countdown');
  if (days > 0) {
    el.textContent = days;
  } else if (days === 0) {
    el.textContent = 'HOJE';
    el.style.fontSize = '18px';
  } else {
    el.textContent = '🏅';
  }
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function toggleItem(id) {
  state[id] = !state[id];
  saveState();
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) {
    if (state[id]) el.classList.add('checked');
    else el.classList.remove('checked');
  }
  updateProgress();
  updateDayProgress(id);
}

function updateDayProgress(itemId) {
  DAYS.forEach(day => {
    const hasItem = day.cats.some(cat => cat.items.some(i => i.id === itemId));
    if (!hasItem) return;
    const { total, done } = countDayItems(day);
    const el = document.getElementById(`day-prog-${day.id}`);
    if (el) {
      el.textContent = `${done}/${total}`;
      el.className = 'day-progress' + (done === total ? ' done' : '');
    }
  });
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  DAYS.forEach(day => {
    const { total, done } = countDayItems(day);
    const section = document.createElement('div');
    section.className = 'day-section';

    let banner = '';
    if (day.isRaceDay) {
      banner = `<div class="race-day-banner">
        <div class="race-day-banner-icon">🏃</div>
        <div class="race-day-banner-text"><strong>NB 42k POA</strong><br>21k · Porto Alegre</div>
        <div class="race-day-banner-time">07h00</div>
      </div>`;
    }

    let catsHtml = '';
    day.cats.forEach(cat => {
      let itemsHtml = '';
      cat.items.forEach(item => {
        const checked = state[item.id] ? 'checked' : '';
        const note = item.note ? `<div class="item-note">${item.note}</div>` : '';
        itemsHtml += `
          <div class="item ${checked}" data-id="${item.id}" onclick="toggleItem('${item.id}')">
            <div class="checkbox">
              <svg class="checkbox-tick" width="12" height="9" viewBox="0 0 12 9" fill="none">
                <path d="M1 4L4.5 7.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="item-body">
              <div class="item-text">${item.text}</div>
              ${note}
            </div>
            <div class="item-dot ${cat.dot}"></div>
          </div>`;
      });
      catsHtml += `
        <div class="cat-block">
          <div class="cat-label">${cat.label}</div>
          <div class="items">${itemsHtml}</div>
        </div>`;
    });

    section.innerHTML = `
      ${banner}
      <div class="day-header">
        <div class="day-chip ${day.chip}">${day.date}</div>
        <div class="day-title">${day.title}</div>
        <div class="day-progress${done === total ? ' done' : ''}" id="day-prog-${day.id}">${done}/${total}</div>
      </div>
      ${catsHtml}`;

    main.appendChild(section);
  });
}

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Reiniciar todo o checklist?')) {
    state = {};
    saveState();
    render();
    updateProgress();
  }
});

loadState();
render();
updateProgress();
updateCountdown();
setInterval(updateCountdown, 60000);
</script>
</body>
</html>
